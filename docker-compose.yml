version: '3.8'

services:
  # issuer-mysql (dockerized DB) removed — this deployment connects to an existing external MySQL
  # server via CONNECTION_STRING in .env instead of a compose-managed database. If you ever need a
  # self-contained local DB again, restore the issuer-mysql service block (see git history / the
  # docker-compose.lab.yml at that point) along with the api service's `depends_on`.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: issuer-api
    ports:
      - "5002:8080"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - lab-network

networks:
  lab-network:
    external: true
